# 地点语义地图：地点名 -> map 坐标系下的目标位姿
#
# 坐标怎么填（任选其一）：
#   1) 打开 RViz 加载地图，把鼠标移到目标房间中央，顶部/状态栏会显示地图坐标 (x, y)；
#      朝向 yaw 先填 0，之后觉得方向不对再调。
#   2) 用键盘把车遥控到目标点，然后读当前位置：
#        ros2 topic echo /amcl_pose --once
#      position.x / position.y 就是坐标。
#
# yaw 单位是弧度：0 = 朝 +x，1.57 = 朝 +y，3.14 = 朝 -x
#
# 下面都是占位坐标，请按实际房间自己改：
厨房: {x: 0.07, y: -0.04, yaw: 0.0}
客厅: {x: 1.71, y: -0.07, yaw: 0.0}
# 按需继续加，例如：
# 卧室: {x: 0.0, y: 0.0, yaw: 0.0}
# 卫生间: {x: 0.0, y: 0.0, yaw: 0.0}
